name: Deploy album clock Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "data/albums.csv"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: albumclock-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx wrangler types --check
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
      - name: Deploy Worker and Durable Object migration
        run: npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production API
        if: ${{ vars.WORKER_BASE_URL != '' }}
        run: |
          curl --fail --silent --show-error "${{ vars.WORKER_BASE_URL }}/health"
          curl --fail --silent --show-error "${{ vars.WORKER_BASE_URL }}/v1/status"
