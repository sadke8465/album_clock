name: Test firmware and pack tools

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test-firmware.yml"

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt platformio
      - run: python -m unittest discover -s tests -v
      - run: pio run -d firmware -e waveshare-album-clock -e waveshare-panel-test
